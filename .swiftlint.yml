# Mechanical half of the coding rules. The rest is read by a person.

included:
  - Packages/RightClickMenu/Sources
  - Packages/RightClickMenu/Tests
  - bundles

excluded:
  - .build
  - DerivedData
  - .dist

disabled_rules:
  # Files are lower-hyphen-case; this rule wants them named after a type.
  - file_name
  # Documentation is DocC on the declaration, not a header comment block.
  - orphaned_doc_comment
  # A trailing comma keeps a one-line diff to one line when an entry is added.
  - trailing_comma
  # String(decoding:as:) cannot fail and is the current spelling. The rule wants the older one.
  - optional_data_string_conversion

opt_in_rules:
  - empty_count
  - first_where
  - last_where
  - contains_over_filter_count
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - redundant_nil_coalescing
  - explicit_init
  - toggle_bool
  - prefer_self_in_static_references

# Small files. 400 is hard. Tests get 1500 via Tests/.swiftlint.yml.
file_length:
  warning: 250
  error: 400
  ignore_comment_only_lines: false

# Flat code. Target one level, three is the hard limit.
nesting:
  type_level: 2
  function_level: 3

cyclomatic_complexity:
  warning: 6
  error: 10

type_body_length:
  warning: 150
  error: 250

function_body_length:
  warning: 40
  error: 60

function_parameter_count:
  warning: 5
  error: 6

line_length:
  warning: 100
  error: 120
  ignores_urls: true

# Naming. No abbreviations except id, url, fps.
identifier_name:
  min_length: 2
  excluded: [id, url, fps, to, in, at, of, x, y]

type_name:
  min_length: 3

custom_rules:
  colour_spelling:
    name: "Spelled colour"
    regex: "(?i)colour"
    message: "Spelled color, never colour."
    severity: error

  inline_comment:
    name: "Inline comment"
    regex: "^[ \\t]*//(?!/)(?![ \\t]*MARK:)(?![ \\t]*swiftlint:)"
    message: "No inline comments. Name it, or write DocC on the declaration."
    severity: error

  else_branch:
    name: "else"
    regex: "\\}[ \\t]*\\n?[ \\t]*else\\b"
    message: "No else. guard to leave, switch to choose."
    severity: error

  literature_reference:
    name: "Reference to the documents"
    regex: "(CODE-RULES|literature/|§[0-9])"
    message: "No reference to the documents from code. Write the reason instead."
    severity: error
